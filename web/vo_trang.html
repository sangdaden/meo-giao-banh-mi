html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: var(--paper);
	background-color: var(--teal);
	overflow: hidden;
	touch-action: none;
	font-family: "Baloo 2", "Nunito", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#vo {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	padding: 16px;
	box-sizing: border-box;
	background:
		radial-gradient(ellipse at 50% 30%, rgba(255, 248, 234, 0.16), rgba(255, 248, 234, 0) 60%),
		var(--teal);
	transition: opacity 0.5s ease;
	z-index: 2;
}

#vo.an {
	opacity: 0;
	pointer-events: none;
}

#ten {
	margin: 0;
	font-size: clamp(30px, 7vw, 58px);
	font-weight: 800;
	line-height: 1.05;
	text-align: center;
	color: var(--paper);
	text-shadow: 0 4px 0 var(--ink);
	letter-spacing: 0.5px;
}

#phu {
	margin: -8px 0 0;
	font-size: clamp(14px, 2.6vw, 18px);
	font-weight: 700;
	color: var(--amber);
	text-align: center;
}

#duong {
	position: relative;
	width: min(560px, 86vw);
	height: 96px;
	margin-top: 4px;
}

#bo {
	position: absolute;
	bottom: 11px;
	left: 0;
	width: var(--bo-rong);
	height: 72px;
	background-image: var(--bo-anh);
	background-size: calc(var(--bo-rong) * 8) 72px;
	background-repeat: no-repeat;
	transform: translateX(-60%);
	animation: chay 0.48s steps(8) infinite;
	transition: left 0.35s ease-out;
}

@keyframes chay {
	from { background-position: 0 0; }
	to { background-position: calc(var(--bo-rong) * -8) 0; }
}

#thanh {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	height: 16px;
	border-radius: 999px;
	background: var(--sand);
	border: 3px solid var(--ink);
	box-sizing: border-box;
	overflow: hidden;
}

#day {
	height: 100%;
	width: 0;
	background: var(--crust);
	border-right: 2px solid var(--ink);
	transition: width 0.35s ease-out;
}

#so {
	font-size: 15px;
	font-weight: 700;
	color: var(--cream);
	min-height: 1.3em;
	text-align: center;
}

#meo {
	width: min(560px, 86vw);
	box-sizing: border-box;
	padding: 12px 18px;
	border-radius: 18px;
	background: var(--paper);
	color: var(--ink);
	border: 3px solid var(--ink);
	box-shadow: 0 5px 0 var(--ink);
	font-size: clamp(14px, 2.4vw, 17px);
	font-weight: 600;
	line-height: 1.35;
	min-height: 3.2em;
	display: flex;
	align-items: center;
	gap: 10px;
	transition: opacity 0.3s ease;
}

#meo b {
	color: var(--crust);
	white-space: nowrap;
}

#meo.mo {
	opacity: 0;
}

#loi {
	display: none;
	width: min(560px, 86vw);
	box-sizing: border-box;
	padding: 12px 18px;
	border-radius: 14px;
	background: var(--red);
	color: var(--paper);
	border: 3px solid var(--ink);
	font-size: 15px;
	font-weight: 700;
	text-align: center;
	white-space: pre-line;
}

@media (max-height: 420px) {
	#vo { gap: 8px; }
	#meo { min-height: 0; padding: 8px 14px; }
}

@media (prefers-reduced-motion: reduce) {
	#bo { animation: none; }
}

	setInterval(function () {
		var g = window.meoGame || {};
		if (g.lang === 'vi' || g.lang === 'en') {
			try { localStorage.setItem('meo-ngon-ngu', g.lang); } catch (e) {}
		}
	}, 4000);

	var missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			Promise.race([
				navigator.serviceWorker.getRegistration().then(function (registration) {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(function () { return engine.installServiceWorker(); }),
				new Promise(function (resolve) { setTimeout(resolve, 2000); }),
			]).catch(function (err) {
				console.error('Error while registering service worker:', err);
			}).then(function () {
				window.location.reload();
			});
		} else {
			baoLoi(t.thieu + missing.join('\n'));
		}
		return;
	}

	engine.startGame({
		'onProgress': function (current, total) {
			if (current > 0 && total > 0) {
				tien(current / total);
				so.textContent = current >= total ? t.xong
					: t.tai.replace('%a', (current / 1048576).toFixed(0)).replace('%b', (total / 1048576).toFixed(0));
			}
		},
	}).then(function () {
		tien(1);
		clearInterval(doiMeo);
		vo.classList.add('an');
		setTimeout(function () { vo.remove(); }, 600);
	}, baoLoi);
}());
		</script>
	</body>
</html>

# Tự gộp main vào các PR đang mở (docs/gop-main.md):
# - Mỗi lần main đổi: thử gộp main vào từng PR. Gộp sạch thì đẩy commit gộp lên nhánh PR
#   rồi gọi lại CI của PR; đụng nhau thì gắn nhãn "dung-main", ghi bình luận liệt kê file đụng
#   và đặt trạng thái đỏ "Gộp với main" trên PR.
# - Mỗi lần PR được mở hoặc đẩy thêm: kiểm riêng PR đó (không đẩy gì), đỏ nếu còn đụng main.
# - Chạy tay (Run workflow) được, có ô "chỉ kiểm" để không đẩy.
# PR có nhãn "khong-tu-gop" chỉ được kiểm và báo, không bị đẩy commit gộp.
name: Tự gộp main vào PR

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      chi_kiem:
        description: "Chỉ kiểm và báo, không đẩy commit gộp"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  statuses: write
  actions: write

concurrency:
  group: gop-main-${{ github.event_name == 'pull_request' && github.event.number || 'main' }}
  cancel-in-progress: true

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  gop:
    name: Gộp main vào PR đang mở
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      # QT1: có secret GOP_MAIN_TOKEN (cách tạo: docs/gop-main.md) và token còn dùng được thì đẩy bằng nó:
      # CI của PR tự chạy như khi người đẩy, không cần lượt chạy bù, đẩy được cả khi main đổi file workflow.
      # Không có token hoặc token hết hạn thì dùng GITHUB_TOKEN và gọi lại CI bằng workflow_dispatch như cũ.
      - name: Kiểm token GOP_MAIN_TOKEN
        id: tok
        env:
          T: ${{ secrets.GOP_MAIN_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "Chưa có secret GOP_MAIN_TOKEN: đẩy bằng GITHUB_TOKEN, CI của PR chạy bù bằng workflow_dispatch." | tee -a "$GITHUB_STEP_SUMMARY"
          elif git ls-remote "https://x-access-token:${T}@github.com/${GITHUB_REPOSITORY}.git" HEAD >/dev/null 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "Đẩy bằng GOP_MAIN_TOKEN." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GOP_MAIN_TOKEN không dùng được (hết hạn hoặc thiếu quyền), tạm đẩy bằng GITHUB_TOKEN. Xem docs/gop-main.md."
            echo "⚠️ GOP_MAIN_TOKEN không dùng được (hết hạn?), tạm đẩy bằng GITHUB_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.tok.outputs.ok == '1' && secrets.GOP_MAIN_TOKEN || github.token }}

      - name: Thử gộp main vào từng PR
        env:
          GH_TOKEN: ${{ github.token }}
          CO_PAT: ${{ steps.tok.outputs.ok }}
          TU_GOP: ${{ inputs.chi_kiem && '0' || '1' }}
        run: bash tools/gop_main.sh

  kiem:
    name: Gộp được với main
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Lấy đúng đầu nhánh PR: khi đụng main, GitHub không tạo được ref gộp sẵn.
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Kiểm PR này có đụng main không
        env:
          GH_TOKEN: ${{ github.token }}
          TU_GOP: "0"
          KHO: "1"
        run: bash tools/gop_main.sh ${{ github.event.number }}

# Xuất bản máy tính (Windows .exe và macOS .app) bằng Godot rồi đăng lên GitHub Releases.
# - Mỗi lần cập nhật main: thay file trong bản phát hành "ban-moi-nhat" (link tải cố định).
# - Mỗi lần tạo tag v* (ví dụ v0.2.0): tạo bản phát hành riêng mang số phiên bản đó.
# - Pull request: chỉ xuất và chạy thử, file .zip nằm ở mục Artifacts của lượt chạy.
# Godot 4.3 cần rcedit (chạy qua wine) để gắn icon và thông tin phiên bản vào .exe.
# Bản macOS là universal (Intel + Apple Silicon), chỉ ký ad-hoc, chưa notarize.
name: Bản Windows và macOS (Releases)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"
  RCEDIT_VERSION: "2.0.0"
  LANG: C.UTF-8
  LC_ALL: C.UTF-8
  WINEDEBUG: -all

jobs:
  windows:
    runs-on: ubuntu-24.04
    env:
      ZIP_NAME: MeoGiaoBanhMi-windows.zip
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot, template Windows và rcedit
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-rcedit-${{ env.RCEDIT_VERSION }}

      - name: Tải Godot, template Windows và rcedit
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/windows_*x86_64*' 'templates/version.txt' -d "$dest"
          curl -sSL -o ~/godot/rcedit-x64.exe \
            "https://github.com/electron/rcedit/releases/download/v${RCEDIT_VERSION}/rcedit-x64.exe"
          rm godot.zip templates.tpz

      - name: Cài wine (cho rcedit và để chạy thử .exe)
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends wine64 wine >/dev/null
          wineboot -i >/dev/null 2>&1 || true

      - name: Nhập project và chỉ đường rcedit cho Godot
        run: |
          ~/godot/godot --headless --path . --import || true
          f=~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          sed -i "s|^export/windows/rcedit = .*|export/windows/rcedit = \"$HOME/godot/rcedit-x64.exe\"|; s|^export/windows/wine = .*|export/windows/wine = \"$(command -v wine)\"|" "$f"
          grep -q "rcedit-x64.exe" "$f"

      - name: Ghi số phiên bản theo tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # v0.2 -> 0.2.0.0, v1.2.3 -> 1.2.3.0
          v=$(echo "${GITHUB_REF_NAME#v}" | sed 's/[^0-9.].*//')
          IFS=. read -r a b c d <<< "$v"
          v4="${a:-0}.${b:-0}.${c:-0}.${d:-0}"
          sed -i "s|^application/file_version=.*|application/file_version=\"$v4\"|; s|^application/product_version=.*|application/product_version=\"$v4\"|" export_presets.cfg
          grep _version= export_presets.cfg

      - name: Xuất bản Windows
        run: |
          mkdir -p export
          ~/godot/godot --headless --path . --export-release "Windows Desktop" export/MeoGiaoBanhMi.exe 2>&1 | tee export.log
          test -s export/MeoGiaoBanhMi.exe
          if grep -q "Resources Modification" export.log; then echo "::error::Không gắn được icon bằng rcedit"; exit 1; fi

      - name: Chạy thử .exe bằng wine (tự chơi 5 đơn)
        run: |
          timeout 600 wine export/MeoGiaoBanhMi.exe --headless -- --autotest 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee autotest.log
          grep -q "AUTOTEST OK" autotest.log

      - name: Đóng gói zip
        run: |
          cat > export/DOC-TRUOC.txt <<EOF
          Mèo Giao Bánh Mì - bản chơi thử cho Windows 10/11 (64-bit)
          Mã commit: ${GITHUB_SHA::7}

          1. Giải nén cả thư mục này ra (không chạy thẳng trong file zip).
          2. Bấm đúp MeoGiaoBanhMi.exe.
          3. Nếu Windows hiện "Windows protected your PC": bấm "More info" rồi "Run anyway".
             Game chưa ký số nên Windows cảnh báo vậy, không phải virus.

          Phím: WASD chạy, Shift chạy nhanh, Space nhảy, chuột xoay camera, Esc tạm dừng.
          EOF
          sed -i 's/^ *//; s/$/\r/' export/DOC-TRUOC.txt
          cd export && zip -q -9 "../$ZIP_NAME" MeoGiaoBanhMi.exe DOC-TRUOC.txt
          ls -la "../$ZIP_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: MeoGiaoBanhMi-windows
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

  macos:
    runs-on: ubuntu-24.04
    env:
      ZIP_NAME: MeoGiaoBanhMi-macos.zip
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot và template macOS
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Tải Godot và template macOS
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          unzip -q -j templates.tpz 'templates/macos.zip' 'templates/version.txt' -d "$dest"
          rm godot.zip templates.tpz

      - name: Ghi số phiên bản theo tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(echo "${GITHUB_REF_NAME#v}" | sed 's/[^0-9.].*//')
          sed -i "s|^application/short_version=.*|application/short_version=\"$v\"|" export_presets.cfg
          grep short_version= export_presets.cfg

      - name: Xuất bản macOS (universal, ký ad-hoc)
        run: |
          ~/godot/godot --headless --path . --import || true
          # Chạy thử logic game trước (bản macOS không chạy được trên máy Linux)
          timeout 600 ~/godot/godot --headless --path . -- --autotest 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee autotest.log
          grep -q "AUTOTEST OK" autotest.log
          # Chơi liền các ngày: xong ngày thì lưu ngày kế, hết tuần sang Tuần mới
          timeout 300 ~/godot/godot --headless --path . -s tests/test_lien_ngay.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee lien_ngay.log
          grep -q "LIEN NGAY TEST OK" lien_ngay.log
          # Đơn mua trứng Thứ Ba: túi trứng dễ vỡ, tạp hóa Cô Hai
          timeout 300 ~/godot/godot --headless --path . --script res://tools/egg_test.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee egg_test.log
          grep -q "EGG TEST OK" egg_test.log
          # Góc cờ tướng Thứ Ba: suỵt, mắng, chiếu tướng, giao cạnh ấm trà
          timeout 300 ~/godot/godot --headless --path . --script res://tools/chess_test.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee chess.log
          grep -q "CHESS TEST OK" chess.log
          # Thứ Tư mưa: đủ 5 đơn khi đường ngập, và đi bộ thật trên đường sân thượng, ván, cổng chào
          timeout 600 ~/godot/godot --headless --path . -- --autotest --ngay=thu_tu --ngap 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee thu_tu.log
          grep -q "AUTOTEST THU_TU OK" thu_tu.log
          timeout 300 ~/godot/godot --headless --path . -s tests/test_thu_tu.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee thu_tu_test.log
          grep -q "THU TU TEST OK" thu_tu_test.log
          # Thứ Năm leo chung cư: xoay được camera ngoài hẻm và trong lồng cầu thang
          timeout 300 ~/godot/godot --headless --path . -s tests/test_xoay_camera.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee xoay_camera.log
          grep -q "XOAY CAMERA OK" xoay_camera.log
          # Model G1 đã duyệt (chung cư + Thứ Năm ngoài phố): mở được, đủ node theo tên bộ phận
          timeout 300 ~/godot/godot --headless --path . -s tests/test_model_g1.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee model_g1.log
          grep -q "MODEL G1 OK" model_g1.log
          # Thứ Năm cả ngày: 4 đơn phố, đơn 5 sang cảnh chung cư rồi về phố tổng kết; leo thật tủ báo, khe hông, gác lửng
          timeout 600 ~/godot/godot --headless --path . -- --autotest --ngay=thu_nam 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee thu_nam.log
          grep -q "AUTOTEST THU_NAM OK" thu_nam.log
          timeout 300 ~/godot/godot --headless --path . -s tests/test_thu_nam.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee thu_nam_test.log
          grep -q "THU NAM TEST OK" thu_nam_test.log
          # Thứ Bảy: nhảy vào chồng thùng cạnh lò bánh không bị treo mãi trên mép (giữ phím đi tới tự leo lên, lùi ra buông)
          timeout 300 ~/godot/godot --headless --path . -s tests/test_bam_mep_thu_bay.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee bam_mep.log
          grep -q "BAM MEP TEST OK" bam_mep.log
          # Vành phố P1: mép mềm chặn Bơ mà không chặn camera, đầu đường cho Bơ quay đầu, cầu kênh, phông trời
          timeout 300 ~/godot/godot --headless --path . -s tests/test_vanh_pho.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee vanh_pho.log
          grep -q "TEST VANH PHO OK" vanh_pho.log
          # Đồ đeo lưng: phần cứng không hở khỏi lưng quá 6 mm khi thở, ngồi, liếm (Bơ đực, Bơ cái)
          timeout 900 ~/godot/godot --headless --path . -s tests/test_khe_lung.gd 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee khe_lung.log
          grep -q "KHE LUNG TEST OK" khe_lung.log
          # Chủ Nhật Hội mèo: khay bánh sáng không tính giờ, bot chơi đủ 5 trò, tới tổng kết tuần
          timeout 600 ~/godot/godot --headless --path . -- --autotest --ngay=chu_nhat 2>&1 | grep -v 'mesh_storage\|Parameter "m"' | tee chu_nhat.log
          grep -q "AUTOTEST CHU_NHAT OK" chu_nhat.log
          mkdir -p export
          ~/godot/godot --headless --path . --export-release "macOS" "export/$ZIP_NAME"
          unzip -l "export/$ZIP_NAME" | grep -q "_CodeSignature/CodeResources"
          unzip -l "export/$ZIP_NAME" | grep -q ".app/Contents/MacOS/"
          mv "export/$ZIP_NAME" .
          ls -la "$ZIP_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: MeoGiaoBanhMi-macos
          path: ${{ env.ZIP_NAME }}
          retention-days: 14

  release:
    needs: [windows, macos]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Đăng lên "Bản mới nhất" (main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=ban-moi-nhat
          git tag -f "$tag"
          git push -f origin "refs/tags/$tag"
          notes="Bản tự build từ nhánh main, commit ${GITHUB_SHA::7} ($(date -u +'%d/%m/%Y %H:%M') UTC).
          Windows: tải MeoGiaoBanhMi-windows.zip, giải nén, bấm đúp MeoGiaoBanhMi.exe.
          macOS: tải MeoGiaoBanhMi-macos.zip, giải nén, xem cách mở lần đầu trong README."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" --prerelease --title "Bản mới nhất (tự động)" --notes "$notes"
          fi
          gh release upload "$tag" dist/*.zip --clobber

      - name: Tạo bản phát hành theo tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Mèo Giao Bánh Mì $GITHUB_REF_NAME" --generate-notes
